{% extends 'base.html' %}
{% load i18n %}
{% block title %}{% trans "Password updated" %}{% endblock %}
{% block body_class %}is-auth{% endblock %}
{% block content %}
<div class="container py-5" style="max-width:420px;">
  <div class="zl-card p-4 text-center">
    <h1 class="h4 mb-2">{% trans "Done" %}</h1>
    <p>{% trans "Password updated. You can sign in now." %}</p>

  </div>
</div>
{% endblock %}
