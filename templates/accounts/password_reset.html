{% extends 'base.html' %}

{% block title %}Parolni tiklash{% endblock %}
{% block body_class %}is-auth{% endblock %}

{% block content %}
<div class="container py-5" style="max-width:420px;">
  <div class="zl-card p-4">
    <h1 class="h4 mb-2">Parolni tiklash</h1>
    <p class="zl-meta mb-3">Emailingizni kiriting — tiklash havolasi yuboriladi.</p>
    <form method="post">
      {% csrf_token %}
      {{ form.email.errors }}
      <div class="mb-3">
        <label class="form-label">Email</label>
        <input type="email" name="email" class="form-control" required autofocus>
      </div>
      <button type="submit" class="btn btn-primary w-100">Yuborish</button>
    </form>
    <a href="{% url 'accounts:login' %}" class="d-block text-center mt-3 small">Kirishga qaytish</a>
  </div>
</div>
{% endblock %}
