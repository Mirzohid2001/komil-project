{% extends 'base.html' %}
{% load i18n %}
{% block title %}{% trans "Email sent" %}{% endblock %}
{% block body_class %}is-auth{% endblock %}
{% block content %}
<div class="container py-5" style="max-width:420px;">
  <div class="zl-card p-4 text-center">
    <h1 class="h4 mb-2">{% trans "Email sent" %}</h1>
    <p class="mb-0">{% trans "If the email is registered, a reset link was sent." %}</p>
    <a href="{% url 'accounts:login' %}" class="btn btn-primary mt-3">{% trans "Login" %}</a>
  </div>
</div>
{% endblock %}
