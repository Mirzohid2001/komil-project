{% extends 'base.html' %}
{% block title %}Yangi parol{% endblock %}
{% block body_class %}is-auth{% endblock %}
{% block content %}
<div class="container py-5" style="max-width:420px;">
  <div class="zl-card p-4">
    {% if validlink %}
    <h1 class="h4 mb-3">Yangi parol</h1>
    <form method="post">
      {% csrf_token %}
      {{ form.as_p }}
      <button type="submit" class="btn btn-primary w-100">Saqlash</button>
    </form>
    {% else %}
    <p class="mb-0">Havola eskirgan yoki noto‘g‘ri. Qayta so‘rang.</p>
    <a href="{% url 'accounts:password_reset' %}" class="btn btn-primary mt-3">Qayta</a>
    {% endif %}
  </div>
</div>
{% endblock %}
